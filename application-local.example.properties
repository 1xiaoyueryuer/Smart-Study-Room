# 复制到 .local/application-local.properties。个人口令不要提交。
# 本机作为局域网主机、让同一 Wi-Fi 下其他设备访问时，取消下一行注释并重启：
# server.address=0.0.0.0
# 可选 HTTPS：手机摄像头需要 HTTPS，证书需让手机信任。取消以下注释并填入本机 PKCS12。
# server.ssl.enabled=true
# server.ssl.key-store=file:C:/absolute/path/server.p12
# server.ssl.key-store-password=CHANGE_ME
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=studyroom
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/studyroom_java
spring.datasource.username=studyroom
spring.datasource.password=CHANGE_ME
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=3
spring.redis.password=
# 自行生成至少32字符的随机密钥
studyroom.jwt-secret=CHANGE_ME_TO_A_RANDOM_SECRET_AT_LEAST_32_CHARACTERS
