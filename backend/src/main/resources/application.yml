server:
  # 默认仅监听本机回环；局域网多设备访问时设置 STUDYROOM_SERVER_ADDRESS=0.0.0.0 或在本地配置写 server.address=0.0.0.0
  address: ${STUDYROOM_SERVER_ADDRESS:127.0.0.1}
  port: ${STUDYROOM_HOST_PORT:8080}
  # 可选 HTTPS：手机浏览器的摄像头只在 HTTPS 或 localhost 下可用。
  # 开启后局域网地址、二维码和启动日志都会使用 https://；证书需让手机信任。
  ssl:
    enabled: ${STUDYROOM_SSL_ENABLED:false}
    key-store: ${STUDYROOM_SSL_KEY_STORE:}
    key-store-password: ${STUDYROOM_SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${STUDYROOM_SSL_KEY_STORE_TYPE:PKCS12}
    key-alias: ${STUDYROOM_SSL_KEY_ALIAS:studyroom}
spring:
  config:
    import: optional:file:../.local/application-local.properties,optional:file:.local/application-local.properties
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${STUDYROOM_DB_URL:jdbc:postgresql://127.0.0.1:5433/studyroom_java}
    username: ${STUDYROOM_DB_USERNAME:studyroom}
    password: ${STUDYROOM_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 10000
  redis:
    host: ${STUDYROOM_REDIS_HOST:localhost}
    port: ${STUDYROOM_REDIS_PORT:6379}
    password: ${STUDYROOM_REDIS_PASSWORD:}
    database: ${STUDYROOM_REDIS_DATABASE:3}
    timeout: 2s
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  jackson:
    deserialization:
      accept-float-as-int: false
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Shanghai
  flyway:
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
  sql:
    init:
      mode: never
      encoding: UTF-8
studyroom:
  jwt-secret: ${STUDYROOM_JWT_SECRET}
  seed: ${STUDYROOM_SEED:true}
  scheduler-enabled: ${STUDYROOM_SCHEDULER_ENABLED:true}
  zone: Asia/Shanghai
